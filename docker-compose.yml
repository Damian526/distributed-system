services:
  postgres:
    image: postgres:15-alpine
    container_name: saas_postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 7PmWaW010vYKAl
      POSTGRES_DB: saas_analytics
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - distributed_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d saas_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis:
    image: redis:7-alpine
    container_name: saas_redis_queue
    ports:
      - "6379:6379"
    networks:
      - distributed_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: saas_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    networks:
      - distributed_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # one-shot job that creates the bucket on startup
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - distributed_network
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb --ignore-existing local/reports
      "
volumes:
  pgdata:
  minio_data:

networks:
  distributed_network:
    driver: bridge